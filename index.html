<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小綜合五上單元一「化解危機總動員」多維度數據探究平台</title>
  
  <style>
    :root {
      --header-bg: #0f172a;
      --tab-bg: #1e293b;
      --tab-hover: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --active-accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: #0f172a;
      color: var(--text-light);
      overflow: hidden;
    }

    /* 頂部導航總容器 */
    .dashboard-header {
      background-color: var(--header-bg);
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 108px;
    }

    /* 頂層資訊列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px;
      border-bottom: 1px solid #1e293b;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background-color: #f97316;
      color: #ffffff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .title-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .subtitle-tag {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-left: 6px;
    }

    /* 工具控制按鈕群 */
    .control-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      background-color: var(--tab-bg);
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .btn-tool:hover {
      background-color: var(--tab-hover);
      color: #ffffff;
    }

    /* 8 大議題切換標籤列 */
    .tabs-scroller {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding: 6px 14px;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }

    .tabs-scroller::-webkit-scrollbar {
      height: 4px;
    }

    .tabs-scroller::-webkit-scrollbar-thumb {
      background-color: #475569;
      border-radius: 4px;
    }

    .topic-tab {
      background-color: var(--tab-bg);
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .topic-tab:hover {
      background-color: var(--tab-hover);
      color: #ffffff;
    }

    .topic-tab.active {
      background-color: var(--active-accent);
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
    }

    .tab-index {
      font-weight: bold;
      font-size: 0.75rem;
      opacity: 0.85;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .tab-hot {
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 3px;
      background-color: #ef4444;
      color: #ffffff;
      font-weight: bold;
    }

    /* 舞台主體 iframe 區域 */
    .stage-container {
      width: 100%;
      height: calc(100% - 108px);
      position: relative;
      background: #ffffff;
    }

    iframe#topicViewer {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 響應式微調 */
    @media (max-width: 900px) {
      .subtitle-tag {
        display: none;
      }
      .dashboard-header {
        height: auto;
      }
      .stage-container {
        height: calc(100% - 116px);
      }
    }
  </style>
</head>
<body>

  <!-- 頂部儀表板導航列 -->
  <header class="dashboard-header">
    <div class="top-bar">
      <div class="brand-title">
        <a href="ebook_unit1.html" target="_blank" class="brand-badge" title="在新分頁開啟電子書教材">綜合五上 ↗</a>
        <span class="title-text">單元一：化解危機總動員</span>
        <span class="subtitle-tag">臺灣近5年數據考證與專案探究學習系統</span>
      </div>

      <div class="control-actions">
        <button class="btn-tool" onclick="navigateTopic(-1)">◀ 上一題</button>
        <button class="btn-tool" onclick="navigateTopic(1)">下一題 ▶</button>
        <a id="btnExternal" class="btn-tool" href="#" target="_blank" title="以獨立新分頁開啟此統計檔案">
          ↗ 獨立分頁開啟
        </a>
        <button class="btn-tool" onclick="toggleFullScreen()">⛶ 全螢幕</button>
      </div>
    </div>

    <!-- 8 大議題快速選單標籤 -->
    <nav class="tabs-scroller" id="tabsNav">
      <!-- 標籤將由 JS 動態生成 -->
    </nav>
  </header>

  <!-- 主要內容展示視窗 (iframe) -->
  <main class="stage-container">
    <iframe id="topicViewer" name="topicViewer" src="" title="議題數據內容呈現"></iframe>
  </main>

  <script>
    // 8 大議題配置資料清單 (按熱門度排序)
    const topics = [
      {
        id: 1,
        title: '網路電信詐騙危機',
        file: 'fraud_statistics.html',
        hot: '最熱門',
        accent: '#2563eb',
        pages: '課本 P.8, 11, 13, 16'
      },
      {
        id: 2,
        title: '行人地獄與交通安全',
        file: 'pedestrian_safety_statistics.html',
        hot: '重道安',
        accent: '#059669',
        pages: '課本 P.5, 15, 18, 19'
      },
      {
        id: 3,
        title: '重大強震與建築韌性',
        file: 'earthquake_safety_statistics.html',
        hot: '大天災',
        accent: '#ea580c',
        pages: '課本 P.6, 23, 24, 25'
      },
      {
        id: 4,
        title: '旱澇極端化與水資源',
        file: 'water_climate_crisis_statistics.html',
        hot: '氣候變遷',
        accent: '#0284c7',
        pages: '課本 P.6, 9, 10, 34'
      },
      {
        id: 5,
        title: '新興毒品偽裝與防制',
        file: 'drug_prevention_statistics.html',
        hot: '青春防線',
        accent: '#7c3aed',
        pages: '課本 P.8, 28, 38'
      },
      {
        id: 6,
        title: '校園與網路霸凌防制',
        file: 'bullying_prevention_statistics.html',
        hot: '友善校園',
        accent: '#db2777',
        pages: '課本 P.9, 26, 30, 31'
      },
      {
        id: 7,
        title: '登革熱與重要傳染病',
        file: 'epidemic_prevention_statistics.html',
        hot: '公衛防疫',
        accent: '#0d9488',
        pages: '課本 P.4, 13, 15, 22'
      },
      {
        id: 8,
        title: '居家用電與火災安全',
        file: 'electrical_fire_safety_statistics.html',
        hot: '居家安檢',
        accent: '#ef4444',
        pages: '課本 P.14, 16, 21, 27'
      }
    ];

    let currentIndex = 0;
    const iframe = document.getElementById('topicViewer');
    const tabsNav = document.getElementById('tabsNav');
    const btnExternal = document.getElementById('btnExternal');

    // 動態建置標籤
    function renderTabs() {
      tabsNav.innerHTML = '';
      topics.forEach((topic, idx) => {
        const tab = document.createElement('button');
        tab.className = `topic-tab ${idx === currentIndex ? 'active' : ''}`;
        tab.onclick = () => selectTopic(idx);

        const badgeHtml = topic.hot ? `<span class="tab-hot">${topic.hot}</span>` : '';
        tab.innerHTML = `
          <span class="tab-index">0${topic.id}</span>
          <span>${topic.title}</span>
          ${badgeHtml}
        `;
        tabsNav.appendChild(tab);
      });
    }

    // 選取並切換議題
    function selectTopic(index) {
      if (index < 0 || index >= topics.length) return;
      currentIndex = index;
      const target = topics[currentIndex];

      // 切換 iframe 網址
      iframe.src = target.file;
      btnExternal.href = target.file;

      // 更新主色調連動
      document.documentElement.style.setProperty('--active-accent', target.accent);

      // 更新標籤樣式
      const allTabs = document.querySelectorAll('.topic-tab');
      allTabs.forEach((tab, idx) => {
        if (idx === currentIndex) {
          tab.classList.add('active');
          tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          tab.classList.remove('active');
        }
      });
    }

    // 上一題 / 下一題切換
    function navigateTopic(direction) {
      let nextIndex = currentIndex + direction;
      if (nextIndex < 0) nextIndex = topics.length - 1;
      if (nextIndex >= topics.length) nextIndex = 0;
      selectTopic(nextIndex);
    }

    // 全螢幕切換
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 鍵盤左右箭頭快速鍵支援
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') navigateTopic(-1);
      if (e.key === 'ArrowRight') navigateTopic(1);
    });

    // 初始化頁面
    window.onload = () => {
      renderTabs();
      selectTopic(0); // 預設載入第 1 項：電信與網路詐騙
    };
  </script>
</body>
</html>
